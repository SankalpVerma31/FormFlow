<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${event.title})}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="main">
        <div class="form-narrow">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <div class="form-hero">
                <h1 th:text="${event.title}">Title</h1>
                <p class="text-muted mb-2" style="white-space: pre-wrap" th:text="${event.description}"></p>
                <div class="small text-muted">
                    <i class="bi bi-alarm me-1"></i>Deadline <strong th:text="${#temporals.format(event.deadlineAt, 'dd MMM yyyy, hh:mm a')}"></strong> IST
                    · by <span th:text="${event.creator.fullName}"></span> · <span class="text-danger">*</span> required
                </div>
            </div>
            <!-- The questions below are generated from the database. novalidate = we rely on SERVER validation. -->
            <form th:action="@{/e/{t}(t=${event.publicToken})}" method="post" data-loading="Submitting...">
                <th:block th:each="qv : ${inputs}"><div th:replace="~{fragments/question :: input(${qv})}"></div></th:block>
                <div class="d-flex justify-content-between align-items-center mb-5">
                    <button class="btn btn-primary btn-lg px-5" type="submit">Submit</button>
                    <a class="btn btn-link text-muted" th:href="@{/participant}">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
