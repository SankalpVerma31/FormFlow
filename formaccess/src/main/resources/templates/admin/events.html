<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('All events')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="main">
        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="page-header"><div><h1>All events</h1><p class="subtitle">Every event on the platform.</p></div></div>
        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead><tr><th>Event</th><th>Creator</th><th>Status</th><th>Deadline</th><th>Submitted</th><th>Eligible</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="p : ${events}">
                        <td class="fw-semibold" th:text="${p.event.title}"></td>
                        <td th:text="${p.event.creator.fullName}"></td>
                        <td><span th:replace="~{fragments/layout :: status(${p.event.status})}"></span></td>
                        <td class="small" th:text="${#temporals.format(p.event.deadlineAt, 'dd MMM yyyy, hh:mm a')}"></td>
                        <td th:text="${p.submitted}"></td>
                        <td th:text="${p.eligible}"></td>
                        <td class="text-end"><a class="btn btn-sm btn-light" th:href="@{/creator/events/{id}(id=${p.event.id})}">Open</a></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(events)}"><td colspan="7" class="empty-state">No events yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
