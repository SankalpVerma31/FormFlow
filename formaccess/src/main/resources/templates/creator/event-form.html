<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isNew ? 'New event' : 'Edit event'})}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="main">
        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="page-header">
            <div><h1 th:text="${isNew} ? 'Create a new event' : 'Edit event'">Event</h1>
                <p class="subtitle">All times are Indian Standard Time (IST).</p></div>
            <a class="btn btn-light" th:href="${isNew} ? @{/creator} : @{/creator/events/{id}(id=${event.id})}"><i class="bi bi-arrow-left"></i> Back</a>
        </div>

        <div class="card" style="max-width: 860px">
            <div class="card-body p-4">
                <form th:action="${isNew} ? @{/creator/events} : @{/creator/events/{id}/edit(id=${event.id})}"
                      th:object="${eventForm}" method="post" novalidate data-loading="Saving...">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Title</label>
                        <input class="form-control form-control-lg" th:field="*{title}" th:errorclass="is-invalid" placeholder="e.g. Hackathon Registration 2026">
                        <div class="invalid-feedback" th:errors="*{title}"></div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" rows="3" th:field="*{description}" placeholder="What is this form for?"></textarea>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Opens at</label>
                            <input type="datetime-local" class="form-control" th:field="*{startAt}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{startAt}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Deadline</label>
                            <input type="datetime-local" class="form-control" th:field="*{deadlineAt}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{deadlineAt}"></div>
                        </div>
                    </div>

                    <label class="form-label fw-semibold">Deadline enforcement</label>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <div class="form-check border rounded-3 p-3 ps-5 h-100">
                                <input class="form-check-input" type="radio" th:field="*{deadlineMode}" value="AUTOMATIC" id="modeAuto">
                                <label class="form-check-label" for="modeAuto"><strong>Automatic</strong><br>
                                    <span class="small text-muted">The form closes by itself at the deadline.</span></label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check border rounded-3 p-3 ps-5 h-100">
                                <input class="form-check-input" type="radio" th:field="*{deadlineMode}" value="MANUAL" id="modeManual">
                                <label class="form-check-label" for="modeManual"><strong>Manual</strong><br>
                                    <span class="small text-muted">Stays open until you click “Close submissions”.</span></label>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{allowMultipleSubmissions}">
                                <label class="form-check-label" th:for="${#ids.prev('allowMultipleSubmissions')}">Allow more than one submission per person</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{autoReminderEnabled}">
                                <label class="form-check-label" th:for="${#ids.prev('autoReminderEnabled')}">Send automatic reminder</label>
                            </div>
                            <div class="input-group input-group-sm mt-2" style="max-width: 300px">
                                <input type="number" min="1" max="720" class="form-control" th:field="*{reminderHoursBefore}">
                                <span class="input-group-text">hours before deadline</span>
                            </div>
                            <div class="text-danger small" th:errors="*{reminderHoursBefore}"></div>
                        </div>
                    </div>

                    <button class="btn btn-primary btn-lg" type="submit">
                        <i class="bi bi-check2 me-1"></i><span th:text="${isNew} ? 'Create event' : 'Save changes'">Save</span></button>
                </form>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
