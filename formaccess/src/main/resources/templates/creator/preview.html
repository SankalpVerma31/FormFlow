<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Preview')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="main">
        <div class="alert alert-warning d-flex justify-content-between align-items-center form-narrow">
            <span><i class="bi bi-eye me-2"></i><strong>Preview</strong> – this is exactly what participants will see. Nothing is saved.</span>
            <a class="btn btn-sm btn-dark" th:href="@{/creator/events/{id}(id=${event.id})}">Back to editor</a>
        </div>
        <div class="form-narrow">
            <div class="form-hero">
                <h1 th:text="${event.title}">Title</h1>
                <p class="text-muted mb-2" th:text="${event.description}"></p>
                <div class="small text-muted"><i class="bi bi-calendar-event me-1"></i>Deadline:
                    <span th:text="${#temporals.format(event.deadlineAt, 'dd MMM yyyy, hh:mm a')}"></span> IST
                    · <span class="text-danger">*</span> required</div>
            </div>
            <form onsubmit="return false;">
                <th:block th:each="qv : ${inputs}"><div th:replace="~{fragments/question :: input(${qv})}"></div></th:block>
                <div th:if="${#lists.isEmpty(inputs)}" class="card empty-state"><i class="bi bi-question-square"></i>No questions yet.</div>
                <button class="btn btn-primary btn-lg" type="button" disabled>Submit (disabled in preview)</button>
            </form>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
