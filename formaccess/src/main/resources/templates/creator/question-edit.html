<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit question')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="main">
        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="page-header">
            <div><h1>Edit question</h1><p class="subtitle" th:text="${event.title}"></p></div>
            <a class="btn btn-light" th:href="@{'/creator/events/' + ${event.id} + '#questions'}"><i class="bi bi-arrow-left"></i> Back</a>
        </div>
        <div class="card" style="max-width: 900px">
            <div class="card-body p-4">
                <form th:action="@{/creator/events/{e}/questions/{q}/edit(e=${event.id},q=${question.id})}" th:object="${questionForm}" method="post">
                    <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                        <div th:each="err : ${#fields.allErrors()}" th:text="${err}"></div>
                    </div>
                    <div th:replace="~{fragments/question :: config}"></div>
                    <button class="btn btn-primary mt-4" type="submit"><i class="bi bi-check2 me-1"></i>Save question</button>
                </form>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
