<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Submissions')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="main">
        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="page-header">
            <div><h1>Submissions</h1><p class="subtitle" th:text="${event.title}"></p></div>
            <a class="btn btn-light" th:href="@{/creator/events/{id}(id=${event.id})}"><i class="bi bi-arrow-left"></i> Back to event</a>
        </div>
        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead><tr><th>#</th><th>Participant</th><th>Email</th><th>Dept</th><th>Year</th><th>Submitted at</th><th>Attempt</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="s : ${submissions}">
                        <td class="text-muted" th:text="${s.id}"></td>
                        <td class="fw-semibold" th:text="${s.user.fullName}"></td>
                        <td th:text="${s.user.email}"></td>
                        <td th:text="${s.user.departmentCode ?: '—'}"></td>
                        <td th:text="${s.user.yearOfStudy ?: '—'}"></td>
                        <td th:text="${#temporals.format(s.submittedAt, 'dd MMM yyyy, hh:mm a')}"></td>
                        <td th:text="${s.attemptNo}"></td>
                        <td class="text-end"><a class="btn btn-sm btn-light" th:href="@{/creator/events/{e}/submissions/{s}(e=${event.id},s=${s.id})}">View answers</a></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(submissions)}"><td colspan="8" class="empty-state"><i class="bi bi-inbox"></i>No submissions yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
