<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<div class="auth-wrap">
    <div class="card p-5 text-center" style="max-width: 560px">
        <div class="text-warning mb-3" style="font-size: 3rem"><i class="bi bi-exclamation-octagon"></i></div>
        <h2 class="fw-bold">Something went wrong <span class="text-muted" th:text="${status}"></span></h2>
        <p class="text-muted" th:text="${message}">An unexpected error happened.</p>
        <a class="btn btn-primary mt-2" th:href="@{/dashboard}">Go to dashboard</a>
    </div>
</div>
</body>
</html>
