<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profile')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="main">
        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="page-header">
            <div><h1>My profile</h1><p class="subtitle">Your details are used by eligibility rules.</p></div>
        </div>
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-header"><i class="bi bi-person me-2"></i>Details</div>
                    <div class="card-body">
                        <dl class="row mb-4">
                            <dt class="col-sm-4">Email</dt><dd class="col-sm-8" th:text="${user.email}"></dd>
                            <dt class="col-sm-4">Role</dt><dd class="col-sm-8"><span th:replace="~{fragments/layout :: role(${user.role})}"></span></dd>
                            <dt class="col-sm-4">Registered</dt><dd class="col-sm-8" th:text="${#temporals.format(user.registeredAt, 'dd MMM yyyy')}"></dd>
                        </dl>
                        <form th:action="@{/profile}" th:object="${profileForm}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Full name</label>
                                <input type="text" class="form-control" th:field="*{fullName}" required>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-7">
                                    <label class="form-label">Department</label>
                                    <select class="form-select" th:field="*{deptId}">
                                        <option value="">-- None --</option>
                                        <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.code + ' – ' + d.name}"></option>
                                    </select>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label">Year of study</label>
                                    <select class="form-select" th:field="*{yearOfStudy}">
                                        <option value="">-- None --</option>
                                        <option th:each="y : ${#numbers.sequence(1,5)}" th:value="${y}" th:text="${'Year ' + y}"></option>
                                    </select>
                                </div>
                            </div>
                            <button class="btn btn-primary" type="submit">Save changes</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="card">
                    <div class="card-header"><i class="bi bi-key me-2"></i>Change password</div>
                    <div class="card-body">
                        <form th:action="@{/profile/password}" th:object="${passwordForm}" method="post">
                            <div class="mb-3"><label class="form-label">Current password</label>
                                <input type="password" class="form-control" th:field="*{currentPassword}" required></div>
                            <div class="mb-3"><label class="form-label">New password</label>
                                <input type="password" class="form-control" th:field="*{newPassword}" required minlength="8"></div>
                            <div class="mb-3"><label class="form-label">Confirm new password</label>
                                <input type="password" class="form-control" th:field="*{confirmPassword}" required minlength="8"></div>
                            <button class="btn btn-outline-primary" type="submit">Update password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
