<!DOCTYPE html>
<!-- Shared pieces used by every page: <head>, sidebar, alerts, scripts, status badges. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · FormAccess'">FormAccess</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body>

<aside th:fragment="sidebar" class="sidebar">
    <a class="brand" th:href="@{/dashboard}"><i class="bi bi-ui-checks-grid"></i> FormAccess</a>

    <div sec:authorize="hasRole('ADMIN')">
        <div class="nav-label">Administration</div>
        <a class="nav-item-link" th:href="@{/admin}" th:classappend="${currentPath == '/admin'} ? 'active'">
            <i class="bi bi-speedometer2"></i> Overview</a>
        <a class="nav-item-link" th:href="@{/admin/users}" th:classappend="${#strings.startsWith(currentPath, '/admin/users')} ? 'active'">
            <i class="bi bi-people"></i> Users</a>
        <a class="nav-item-link" th:href="@{/admin/events}" th:classappend="${currentPath == '/admin/events'} ? 'active'">
            <i class="bi bi-collection"></i> All events</a>
    </div>

    <div sec:authorize="hasAnyRole('CREATOR','ADMIN')">
        <div class="nav-label">Creator</div>
        <a class="nav-item-link" th:href="@{/creator}"
           th:classappend="${currentPath == '/creator' or (#strings.startsWith(currentPath, '/creator/events/') and currentPath != '/creator/events/new')} ? 'active'">
            <i class="bi bi-grid-1x2"></i> My events</a>
        <a class="nav-item-link" th:href="@{/creator/events/new}" th:classappend="${currentPath == '/creator/events/new'} ? 'active'">
            <i class="bi bi-plus-circle"></i> New event</a>
    </div>

    <div>
        <div class="nav-label">Participate</div>
        <a class="nav-item-link" th:href="@{/participant}" th:classappend="${currentPath == '/participant'} ? 'active'">
            <i class="bi bi-inbox"></i> My forms</a>
        <a class="nav-item-link" th:href="@{/participant/history}" th:classappend="${#strings.startsWith(currentPath, '/participant/history') or #strings.startsWith(currentPath, '/participant/submissions')} ? 'active'">
            <i class="bi bi-clock-history"></i> Submission history</a>
        <div class="nav-label">Account</div>
        <a class="nav-item-link" th:href="@{/profile}" th:classappend="${currentPath == '/profile'} ? 'active'">
            <i class="bi bi-person-circle"></i> Profile</a>
    </div>

    <div class="sidebar-footer">
        <div class="user-name" sec:authentication="principal.fullName">User</div>
        <div class="user-role mb-2" sec:authentication="principal.role">ROLE</div>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-sm btn-outline-light w-100" type="submit"><i class="bi bi-box-arrow-right me-1"></i> Log out</button>
        </form>
    </div>
</aside>

<div th:fragment="flash">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert" data-autohide>
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}">Saved</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<span th:fragment="status(s)" class="badge rounded-pill" th:classappend="'status-' + ${#strings.toLowerCase(s)}" th:text="${s}">OPEN</span>

<span th:fragment="role(r)" class="badge rounded-pill" th:classappend="'role-' + ${#strings.toLowerCase(r)}" th:text="${r}">ROLE</span>

<th:block th:fragment="scripts">
    <!-- Confirmation dialog used by forms with data-confirm="..." -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title"><i class="bi bi-exclamation-circle text-danger me-2"></i>Please confirm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body" id="confirmModalText">Are you sure?</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmModalOk">Yes, continue</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
