# ============================================================
#  FormAccess configuration
# ============================================================
spring.application.name=formaccess
server.port=8080

# ---------- Database ----------
# The user and password below are created by database/01_schema.sql
spring.datasource.url=jdbc:mysql://localhost:3306/formaccess?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=password

# The tables are created by our SQL scripts, so Hibernate must NOT change them.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ---------- Time zone ----------
# All dates/times in the app are IST (Asia/Kolkata). See FormAccessApplication.main().
spring.jackson.time-zone=Asia/Kolkata

# ---------- Error pages ----------
server.error.include-message=always

# ---------- App settings ----------
# Used to build links inside reminder emails
app.base-url=http://localhost:8080
# Manual reminders: do not remind the same person again within this many hours
app.reminder.min-gap-hours=12

# ---------- Email ----------
# console = emails are only printed in the terminal (default, no setup needed)
# smtp    = really send emails (fill the settings below via environment variables)
app.mail.mode=console
app.mail.from=noreply@formaccess.local
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
