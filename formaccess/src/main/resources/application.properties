# ============================================================
#  FormAccess configuration
# ============================================================
spring.application.name=formaccess
server.port=${PORT:8080}
# ---------- Database ----------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/formaccess?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---------- Time zone ----------
spring.jackson.time-zone=Asia/Kolkata

# ---------- Error pages ----------
server.error.include-message=always

# ---------- App settings ----------
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.reminder.min-gap-hours=12

# ---------- Email ----------
app.mail.mode=console
app.mail.from=noreply@formaccess.local